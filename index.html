    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://streetwatch.earth/#website",
          "url": "https://streetwatch.earth/",
          "name": "StreetWatch",
          "alternateName": ["streetwatch.earth", "StreetWatch Earth"],

        },
        {
          "@type": "Organization",
          "@id": "https://streetwatch.earth/#org",
          "name": "StreetWatch",
          "url": "https://streetwatch.earth/",
          "sameAs": [
            "https://github.com/kalkiyama/streetwatch-web",

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "StreetWatch",
      "url": "https://streetwatch.earth/",
      "applicationCategory": "UtilitiesApplication",

      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

        "7,000+ public webcams, weather satellites and wildlife cameras"
      ]

  <body>
    <div id="root">
      <!-- Crawlable content: replaced the moment the app hydrates, but this is what
           non-JS crawlers and slow connections see instead of an empty div. -->
      <!-- Crawlable fallback, replaced the instant the app hydrates. Kept SHORT: on a slow
           connection this is the first thing a human sees, and a wall of text read as a bug
           ("what is this random text screen?"). Enough for a non-JS crawler, brief enough to
           look like a loading state. -->
      <main style="font-family:system-ui,sans-serif;background:#0E1116;color:#E6EAF2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px">

        <p style="max-width:460px;margin:0 0 18px;line-height:1.6;opacity:.85;font-size:14px">
          A live console for the public planet — flights, ships, satellites, webcams, and a
          24/7 military &amp; drone watch across 1,000+ airspaces with a 90-day public archive.
          Public feeds only, and it states plainly what it cannot see.
        </p>
        <p style="font-size:12px;opacity:.55;margin:0">Loading the live console…</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/sw-register.js"></script>
